<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="nucleus" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9CF0EA"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </radialGradient>
  </defs>

  <!-- Orbit 1 -->
  <ellipse cx="32" cy="32" rx="25" ry="9.5" fill="none"
    stroke="#4ECDC4" stroke-width="1.6" opacity="0.85"
    transform="rotate(-15 32 32)"/>
  <!-- Orbit 2 -->
  <ellipse cx="32" cy="32" rx="25" ry="9.5" fill="none"
    stroke="#FF6B9D" stroke-width="1.6" opacity="0.85"
    transform="rotate(55 32 32)"/>
  <!-- Orbit 3 -->
  <ellipse cx="32" cy="32" rx="25" ry="9.5" fill="none"
    stroke="#FFE66D" stroke-width="1.6" opacity="0.85"
    transform="rotate(115 32 32)"/>

  <!-- Electrons -->
  <circle cx="7"  cy="28.5" r="2.6" fill="#7BE8E1" transform="rotate(-15 32 32)"/>
  <circle cx="57" cy="35.5" r="2.2" fill="#7BE8E1" opacity="0.85" transform="rotate(-15 32 32)"/>

  <circle cx="7"  cy="28.5" r="2.4" fill="#FF9FCA" transform="rotate(55 32 32)"/>
  <circle cx="57" cy="35.5" r="2"   fill="#FF9FCA" opacity="0.85" transform="rotate(55 32 32)"/>

  <circle cx="7"  cy="28.5" r="2.2" fill="#FFE66D" transform="rotate(115 32 32)"/>
  <circle cx="57" cy="35.5" r="1.9" fill="#FFE66D" opacity="0.8" transform="rotate(115 32 32)"/>

  <!-- Nucleus -->
  <circle cx="32" cy="32" r="9.5" fill="url(#nucleus)"/>
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#7BE8E1" stroke-width="1" opacity="0.6"/>
  <circle cx="29.5" cy="29" r="2.6" fill="#FFFFFF" opacity="0.25"/>
</svg>
