<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Справочник соединений — 3D модели</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #999993;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.06);
    --shadow-card: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 56px;
  }

  .page { max-width: 820px; margin: 0 auto; }

  /* ── Back link ── */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text2);
    text-decoration: none; margin-bottom: 24px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--text); }
  .back-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Header ── */
  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px; gap: 12px;
  }
  .header-left h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header-left p { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* ── Filter row ── */
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 10px; align-items: center;
  }
  .filter-label { font-size: 12px; color: var(--text3); }
  .filter-btn {
    padding: 4px 12px; border-radius: 14px; font-size: 12px;
    border: 1px solid var(--border2);
    background: var(--surface); color: var(--text2);
    cursor: pointer; transition: all .15s;
  }
  .filter-btn.on { color: #fff; border-color: transparent; }

  /* ── Compound toolbar ── */
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .compound-btn {
    padding: 5px 13px; border-radius: 18px;
    border: 1px solid var(--border2);
    background: var(--surface); color: var(--text);
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .compound-btn:hover { background: var(--surface2); }
  .compound-btn.active { color: #fff; border-color: transparent; }

  /* ── Canvas ── */
  .canvas-wrap {
    position: relative; width: 100%; height: 380px;
    border-radius: var(--radius);
    overflow: hidden; cursor: grab;
    user-select: none; background: #0f172a;
    box-shadow: var(--shadow-card);
  }
  .canvas-wrap:active { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ── Controls ── */
  .controls-row {
    display: flex; gap: 8px; align-items: center;
    margin-top: 10px; flex-wrap: wrap;
  }
  .ctrl-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--surface); color: var(--text2);
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .ctrl-btn:hover { background: var(--surface2); color: var(--text); }
  .ctrl-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hint-txt { font-size: 12px; color: var(--text3); margin-left: auto; }

  /* ── Info panel ── */
  .info-panel {
    margin-top: 16px; padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .info-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .info-formula { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .info-badge {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    padding: 3px 10px; border-radius: 100px;
    text-transform: uppercase;
  }
  .info-name { font-size: 14px; color: var(--text2); margin-top: 4px; }
  .info-desc { font-size: 13px; color: var(--text2); margin-top: 8px; line-height: 1.6; }
  .elements-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .el-card {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    min-width: 90px;
  }
  .el-sym { font-size: 20px; font-weight: 600; }
  .el-detail { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.65; }
</style>
</head>

   atoms:[{s:'Na',v:1,x:-1.5,y:0,z:0},{s:'O',v:2,x:0.3,y:0,z:0},{s:'H',v:1,x:1.5,y:0,z:0}], bonds:[[0,1,1],[1,2,1]]},
  {id:'CaOH2', f:'Ca(OH)₂',  name:'Гидроксид кальция',     group:'Основания', M:74.093,  desc:'Гашёная известь. Применяется в строительстве и для нейтрализации кислот.',
   atoms:[{s:'Ca',v:2,x:0,y:0,z:0},{s:'O',v:2,x:-1.5,y:0.8,z:0},{s:'O',v:2,x:1.5,y:0.8,z:0},{s:'H',v:1,x:-2.5,y:0.8,z:0},{s:'H',v:1,x:2.5,y:0.8,z:0}], bonds:[[0,1,1],[0,2,1],[1,3,1],[2,4,1]]},
  {id:'CaCO3', f:'CaCO₃',    name:'Карбонат кальция',      group:'Соли',      M:100.09,  desc:'Мел, мрамор, известняк. Широко распространён в природе. Растворяется в кислотах.',
   atoms:[{s:'Ca',v:2,x:-2.2,y:0,z:0},{s:'C',v:4,x:0.8,y:0,z:0},{s:'O',v:2,x:0.8,y:1.5,z:0},{s:'O',v:2,x:2.1,y:-0.7,z:0},{s:'O',v:2,x:-0.6,y:-0.9,z:0}], bonds:[[0,3,1],[0,4,1],[1,2,2],[1,3,1],[1,4,1]]},
];

const allGroups = [...new Set(COMPOUNDS.map(c => c.group))];
let activeGroup = 'Все', current = COMPOUNDS[0];
let rotX = 0.3, rotY = 0.5, scale = 1.0;
let dragging = false, lastX = 0, lastY = 0, autoRot = true;

const canvas = document.getElementById('mol3d');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

function resize() {
  const r = wrap.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  draw();
}

function proj(x, y, z) {
  const cX = Math.cos(rotX), sX = Math.sin(rotX), cY = Math.cos(rotY), sY = Math.sin(rotY);
  let nx = x*cY + z*sY, ny = y, nz = -x*sY + z*cY;
  let ny2 = ny*cX - nz*sX, nz2 = ny*sX + nz*cX;
  const fov = 5.5, pz = nz2 + fov;
  return { sx:(nx/pz)*fov, sy:(ny2/pz)*fov, depth:nz2 };
}

function hexRgb(h) {
  return { r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16) };
}

function draw() {
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0,0,W,H);

  /* subtle grid */
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gs = 60 * devicePixelRatio;
  for(let x = cx % gs; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y = cy % gs; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const unit = Math.min(W,H) * 0.13 * scale;
  const comp = current;
  const p2 = comp.atoms.map((a,i) => ({...proj(a.x,a.y,a.z), sym:a.s, val:a.v, idx:i}));
  const sorted = [...p2].sort((a,b) => a.depth - b.depth);

  /* bonds */
  comp.bonds.forEach(([i,j,order]) => {
    const a = p2[i], b = p2[j];
    const ax = cx+a.sx*unit, ay = cy+a.sy*unit;
    const bx = cx+b.sx*unit, by = cy+b.sy*unit;
    const ca = EL[comp.atoms[i].s]?.color||'#aaa';
    const cb = EL[comp.atoms[j].s]?.color||'#aaa';
    const grad = ctx.createLinearGradient(ax,ay,bx,by);
    grad.addColorStop(0,ca); grad.addColorStop(1,cb);
    if (order === 2) {
      const dx=bx-ax, dy=by-ay, len=Math.sqrt(dx*dx+dy*dy)||1;
      const ox=(-dy/len)*5, oy=(dx/len)*5;
      for (const o of [-1,1]) {
        ctx.beginPath(); ctx.moveTo(ax+ox*o,ay+oy*o); ctx.lineTo(bx+ox*o,by+oy*o);
        ctx.strokeStyle=grad; ctx.lineWidth=2.5; ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
      ctx.strokeStyle=grad; ctx.lineWidth=4.5; ctx.stroke();
    }
  });

  /* atoms */
  sorted.forEach(p => {
    const atom = comp.atoms[p.idx];
    const db = EL[atom.s] || {};
    const px = cx+p.sx*unit, py = cy+p.sy*unit;
    const r = (atom.s.length>1 ? 30 : 25) * scale;
    const rgb = hexRgb(db.color||'#888');

    /* valency legs */
    const legLen = r + 6 + atom.v * 3;
    for (let v = 0; v < atom.v; v++) {
      const angle = (v/atom.v)*Math.PI*2 - Math.PI/2;
      const lx = px+Math.cos(angle)*legLen, ly = py+Math.sin(angle)*legLen;
      ctx.beginPath();
      ctx.moveTo(px+Math.cos(angle)*r, py+Math.sin(angle)*r);
      ctx.lineTo(lx, ly);
      ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.45)`;
      ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2);
      ctx.fillStyle = db.color||'#888'; ctx.fill();
    }

    /* atom sphere */
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle = db.color||'#888'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.stroke();

    /* highlight dot */
    ctx.beginPath(); ctx.arc(px-r*0.28, py-r*0.28, r*0.18, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();

    /* label */
    ctx.font = `600 ${Math.max(11, Math.round(13*scale))}px -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = db.tc || '#fff';
    ctx.fillText(atom.s, px, py);
  });
}

(function loop() {
  if (autoRot && !dragging) { rotY += 0.008; draw(); }
  requestAnimationFrame(loop);
})();

wrap.addEventListener('mousedown', e => { dragging=true; autoRot=false; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mousemove', e => { if(!dragging)return; rotY+=(e.clientX-lastX)*0.012; rotX+=(e.clientY-lastY)*0.012; lastX=e.clientX; lastY=e.clientY; draw(); });
window.addEventListener('mouseup', () => { dragging=false; });
wrap.addEventListener('touchstart', e => { dragging=true; autoRot=false; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }, {passive:true});
wrap.addEventListener('touchmove', e => { if(!dragging)return; rotY+=(e.touches[0].clientX-lastX)*0.014; rotX+=(e.touches[0].clientY-lastY)*0.014; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; draw(); }, {passive:true});
wrap.addEventListener('touchend', () => { dragging=false; });
wrap.addEventListener('wheel', e => { e.preventDefault(); scale=Math.max(0.4,Math.min(2.5,scale-e.deltaY*0.001)); draw(); }, {passive:false});

document.getElementById('btnReset').onclick = () => { rotX=0.3; rotY=0.5; scale=1.0; autoRot=true; };
const btnAuto = document.getElementById('btnAuto');
btnAuto.onclick = () => { autoRot=!autoRot; btnAuto.innerHTML = autoRot
  ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg> Авто-вращение: вкл'
  : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><rect x="9" y="8" width="2" height="8"/><rect x="13" y="8" width="2" height="8"/></svg> Авто-вращение: выкл'; };

function selectC(comp) {
  current = comp; rotX=0.3; rotY=0.5; scale=1.0; autoRot=true;
  document.querySelectorAll('.compound-btn').forEach(b => {
    const isActive = b.dataset.id === comp.id;
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? (GC[comp.group]?.btn||'#555') : '';
  });
  updateInfo(); draw();
}

function buildToolbar() {
  const tb = document.getElementById('toolbar'); tb.innerHTML = '';
  const list = activeGroup === 'Все' ? COMPOUNDS : COMPOUNDS.filter(c => c.group === activeGroup);
  list.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'compound-btn' + (c.id === current.id ? ' active' : '');
    btn.textContent = c.f; btn.dataset.id = c.id; btn.title = c.name;
    if (c.id === current.id) btn.style.background = GC[c.group]?.btn||'#555';
    btn.onclick = () => selectC(c);
    tb.appendChild(btn);
  });
  if (!list.find(c => c.id === current.id)) selectC(list[0] || COMPOUNDS[0]);
}

function buildFilters() {
  const row = document.getElementById('filterRow');
  const groups = ['Все', ...allGroups];
  const applyStyles = () => {
    row.querySelectorAll('.filter-btn').forEach((b, i) => {
      const g = groups[i], active = g === activeGroup;
      b.classList.toggle('on', active);
      if (active) {
        b.style.background = g === 'Все' ? '#374151' : (GC[g]?.btn||'#555');
        b.style.color = '#fff';
        b.style.borderColor = 'transparent';
      } else {
        b.style.background = '';
        b.style.color = g === 'Все' ? '' : (GC[g]?.btn||'#555');
        b.style.borderColor = g === 'Все' ? '' : (GC[g]?.btn||'#555') + '66';
      }
    });
  };
  groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn'; btn.textContent = g;
    btn.onclick = () => { activeGroup = g; applyStyles(); buildToolbar(); };
    row.appendChild(btn);
  });
  applyStyles();
}

function updateInfo() {
  const comp = current;
  const gc = GC[comp.group] || {bg:'#f3f4f6', text:'#374151', btn:'#6b7280'};
  const panel = document.getElementById('infoPanel');
  const elSet = {};
  comp.atoms.forEach(a => { if(!elSet[a.s]) elSet[a.s]=a.v; });
  const roman = ['','I','II','III','IV','V','VI','VII','VIII'];
  const cards = Object.entries(elSet).map(([sym,val]) => {
    const db = EL[sym]||{};
    return `<div class="el-card">
      <div class="el-sym" style="color:${gc.btn}">${sym}</div>
      <div class="el-detail">${db.name||sym}<br>M = ${(db.mass||0).toFixed(3)} г/моль<br>Валентность: <b>${roman[val]||val}</b></div>
    </div>`;
  }).join('');
  panel.innerHTML = `
    <div class="info-top">
      <span class="info-formula">${comp.f}</span>
      <span class="info-badge" style="background:${gc.bg};color:${gc.text}">${comp.group}</span>
    </div>
    <div class="info-name">${comp.name} &middot; M = ${comp.M.toFixed(3)} г/моль</div>
    <div class="info-desc">${comp.desc}</div>
    <div class="elements-grid">${cards}</div>`;
}

buildFilters();
buildToolbar();
updateInfo();
new ResizeObserver(resize).observe(wrap);
resize();
</script>
</body>
</html>
